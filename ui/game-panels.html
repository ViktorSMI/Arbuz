  <div id="shop-panel" class="modal">
    <section class="panel narrow">
      <div class="panel-head">
        <div><div class="panel-kicker">Странствующий караван</div><h2>Торговец</h2></div>
        <button id="btn-shop-close" class="panel-close" type="button" aria-label="Закрыть">✕</button>
      </div>
      <div id="shop-items"></div>
      <div id="shop-seeds">🌰 Семечки: 0</div>
      <div class="panel-actions"><button class="panel-button ghost" data-close-shop type="button">Закрыть [E / Esc]</button></div>
    </section>
  </div>

  <div id="upgrade-panel" class="modal">
    <section class="panel narrow">
      <div class="panel-head"><div><div class="panel-kicker">Новый уровень</div><h2>Выберите улучшение</h2></div></div>
      <div class="upgrade-grid">
        <button class="upgr-btn upgrade-button" data-stat="hp" type="button"><strong>❤️ Здоровье</strong><span>+20 к максимальному HP</span></button>
        <button class="upgr-btn upgrade-button" data-stat="damage" type="button"><strong>⚔️ Урон</strong><span>+25% к силе атак</span></button>
        <button class="upgr-btn upgrade-button" data-stat="stamina" type="button"><strong>💪 Стамина</strong><span>+15 к запасу выносливости</span></button>
        <button class="upgr-btn upgrade-button" data-stat="speed" type="button"><strong>👟 Скорость</strong><span>+0.5 к скорости движения</span></button>
      </div>
    </section>
  </div>

  <div id="settings-panel" class="modal">
    <section class="panel narrow">
      <div class="panel-head">
        <div><div class="panel-kicker">Пауза</div><h2>Настройки</h2></div>
        <button id="btn-settings-close" class="panel-close" type="button" aria-label="Закрыть">✕</button>
      </div>
      <div class="form-grid">
        <div class="form-row"><label for="set-quality">Графика</label><select id="set-quality"><option value="low">Низкая</option><option value="medium" selected>Средняя</option><option value="high">Высокая</option></select></div>
        <div class="form-row"><label for="set-volume">Музыка<small>Громкость саундтрека</small></label><input id="set-volume" type="range" min="0" max="100" value="18"></div>
        <div class="form-row"><label for="set-sfx">Эффекты<small>Удары, шаги и окружение</small></label><input id="set-sfx" type="range" min="0" max="100" value="25"></div>
        <div class="form-row"><label for="set-sens">Чувствительность<small>Скорость камеры</small></label><input id="set-sens" type="range" min="1" max="10" value="2"></div>
        <div class="form-row"><span>Bloom<small>Свечение ярких объектов</small></span><input id="set-bloom" class="toggle" type="checkbox" checked></div>
      </div>
      <div class="panel-divider"></div>
      <div class="panel-actions">
        <button id="btn-save-now" class="panel-button primary" type="button">Сохранить</button>
        <button id="btn-open-journal" class="panel-button ghost" type="button">Журнал [J]</button>
        <button id="btn-return-menu" class="panel-button ghost" type="button">В главное меню</button>
      </div>
      <div id="save-status" class="menu-foot">Сохранение хранится в этом браузере</div>
    </section>
  </div>

  <div id="inventory-panel" class="modal">
    <section class="panel wide">
      <div class="panel-head">
        <div><div class="panel-kicker">Снаряжение</div><h2>Инвентарь</h2></div>
        <button id="btn-inv-close" class="panel-close" type="button" aria-label="Закрыть">✕</button>
      </div>
      <div class="inventory-layout">
        <div class="inventory-section">
          <h3>Экипировано</h3>
          <div id="inv-sword" class="equipped-item">Меч: Обычный</div>
          <div id="inv-armor" class="equipped-item">Броня: Нет</div>
        </div>
        <div class="inventory-section">
          <h3>Рюкзак</h3>
          <div id="inv-items"><div class="inventory-empty">Пусто</div></div>
        </div>
      </div>
      <div class="panel-actions"><button class="panel-button ghost" data-close-inventory type="button">Закрыть [Tab]</button></div>
    </section>
  </div>

  <div id="quest-panel" class="modal">
    <section class="panel wide">
      <div class="panel-head">
        <div><div class="panel-kicker">Путь Арбузиллы</div><h2>Журнал кампании</h2></div>
        <button id="btn-quest-close" class="panel-close" type="button" aria-label="Закрыть">✕</button>
      </div>
      <div id="campaign-stats"></div>
      <div id="quest-list"></div>
      <div class="panel-actions"><button class="panel-button ghost" data-close-journal type="button">Вернуться в игру [J]</button></div>
    </section>
  </div>
