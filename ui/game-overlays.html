  <div id="death-screen">
    <h1>ВЫ ПОГИБЛИ</h1>
    <p id="death-penalty">Часть семечек потеряна. Контрольная точка удержана.</p>
    <button id="btn-respawn" class="menu-button primary" type="button">Возродиться</button>
  </div>

  <div id="victory-screen">
    <h1>🍉 ПОБЕДА</h1>
    <div class="victory-subtitle">Пророчество исполнилось</div>
    <p class="victory-copy">Жан-Пьер Дюваль повержен. Семена прорастут, и сады вернутся.</p>
    <div class="victory-stats">
      <div class="victory-stat"><strong id="victory-kills">0</strong><span>врагов</span></div>
      <div class="victory-stat"><strong id="victory-level">1</strong><span>уровень</span></div>
      <div class="victory-stat"><strong id="victory-seeds">0</strong><span>семечек</span></div>
    </div>
    <div class="menu-actions">
      <button id="btn-newgame-plus" class="menu-button continue" type="button">New Game+ 💀</button>
      <button id="btn-victory-menu" class="menu-button ghost" type="button">Главное меню</button>
    </div>
  </div>

  <div id="chapter-card">
    <div id="chapter-number">Акт I</div>
    <div id="chapter-title">Зелёные холмы</div>
    <div id="chapter-description"></div>
  </div>

  <div id="toast-stack"></div>
  <div id="notification"></div>
  <div id="screen-flash"></div>
  <div id="boss-defeated-text">БОСС ПОВЕРЖЕН</div>
  <div id="biome-name"></div>

  <div id="mobile-controls">
    <div id="touch-joystick"><div id="touch-stick"></div></div>
    <div class="touch-btn" id="touch-attack">⚔️</div>
    <div class="touch-btn" id="touch-dodge">🔄</div>
    <div class="touch-btn" id="touch-jump">⬆️</div>
    <div class="touch-btn" id="touch-lock">🎯</div>
    <div class="touch-btn" id="touch-sprint">🏃</div>
    <div class="touch-btn" id="touch-interact">💬</div>
  </div>
