<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Интерактивный проекционный зал">
  <title>Проекционный зал</title>
  <link rel="icon" href="data:,">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body,
    canvas {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #010305;
    }

    canvas {
      display: block;
      outline: none;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    video {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="room" tabindex="0" aria-label="Интерактивный проекционный зал"></canvas>
  <video
    id="projection-center" crossorigin="anonymous" preload="auto"
    loop muted playsinline aria-hidden="true"
  ></video>
  <video
    id="projection-back" crossorigin="anonymous" preload="auto"
    loop muted playsinline aria-hidden="true"
  ></video>
  <video
    id="projection-right" crossorigin="anonymous" preload="auto"
    loop muted playsinline aria-hidden="true"
  ></video>
  <video
    id="projection-left" crossorigin="anonymous" preload="auto"
    loop muted playsinline aria-hidden="true"
  ></video>
  <video
    id="projection-floor" crossorigin="anonymous" preload="auto"
    loop muted playsinline aria-hidden="true"
  ></video>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js";

    const ROOM = Object.freeze({
      length: 20,
      width: 10,
      height: 5,
      eyeHeight: 1.7,
    });
    const MEDIA_BASE =
      "https://raw.githubusercontent.com/ViktorSMI/Arbuz/f12cfb8f01af4f310ec00518ed47d271f6c7d995";
    const SEAM_WIDTH = 0.08;
    const SURFACE_IDS = Object.freeze({
      center: 0,
      back: 1,
      right: 2,
      left: 3,
      floor: 4,
    });

    const seamVertexShader = [
      "varying vec2 vUv;",
      "void main() {",
      "  vUv = uv;",
      "  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);",
      "}",
    ].join("\n");

    const seamFragmentShader = [
      "uniform sampler2D uCenter;",
      "uniform sampler2D uBack;",
      "uniform sampler2D uRight;",
      "uniform sampler2D uLeft;",
      "uniform sampler2D uFloor;",
      "uniform int uSurface;",
      "uniform float uSeam;",
      "varying vec2 vUv;",
      "vec3 decodeVideo(vec3 color) {",
      "  bvec3 cutoff = lessThanEqual(color, vec3(0.04045));",
      "  vec3 high = pow(color * 0.9478672986 + vec3(0.0521327014), vec3(2.4));",
      "  vec3 low = color * 0.0773993808;",
      "  return mix(high, low, cutoff);",
      "}",
      "vec3 sampleSurface(int surface, vec2 sampleUv) {",
      "  vec2 safeUv = clamp(sampleUv, vec2(0.0), vec2(1.0));",
      "  vec3 color;",
      "  if (surface == 0) color = texture2D(uCenter, safeUv).rgb;",
      "  else if (surface == 1) color = texture2D(uBack, safeUv).rgb;",
      "  else if (surface == 2) color = texture2D(uRight, safeUv).rgb;",
      "  else if (surface == 3) color = texture2D(uLeft, safeUv).rgb;",
      "  else color = texture2D(uFloor, safeUv).rgb;",
      "  return decodeVideo(color);",
      "}",
      "float edgeWeight(float distanceToEdge) {",
      "  return 1.0 - smoothstep(0.0, uSeam, distanceToEdge);",
      "}",
      "void addNeighbor(inout vec3 colorSum, inout float weightSum, int surface, vec2 sampleUv, float weight) {",
      "  colorSum += sampleSurface(surface, sampleUv) * weight;",
      "  weightSum += weight;",
      "}",
      "void main() {",
      "  vec3 colorSum = sampleSurface(uSurface, vUv);",
      "  float weightSum = 1.0;",
      "  if (uSurface == 0) {",
      "    addNeighbor(colorSum, weightSum, 3, vec2(1.0 - vUv.x, vUv.y), edgeWeight(vUv.x));",
      "    addNeighbor(colorSum, weightSum, 2, vec2(1.0 - vUv.x, vUv.y), edgeWeight(1.0 - vUv.x));",
      "    addNeighbor(colorSum, weightSum, 4, vec2(vUv.y, vUv.x), edgeWeight(vUv.y));",
      "  } else if (uSurface == 1) {",
      "    addNeighbor(colorSum, weightSum, 2, vec2(1.0 - vUv.x, vUv.y), edgeWeight(vUv.x));",
      "    addNeighbor(colorSum, weightSum, 3, vec2(1.0 - vUv.x, vUv.y), edgeWeight(1.0 - vUv.x));",
      "    addNeighbor(colorSum, weightSum, 4, vec2(1.0 - vUv.y, 1.0 - vUv.x), edgeWeight(vUv.y));",
      "  } else if (uSurface == 2) {",
      "    addNeighbor(colorSum, weightSum, 0, vec2(1.0 - vUv.x, vUv.y), edgeWeight(vUv.x));",
      "    addNeighbor(colorSum, weightSum, 1, vec2(1.0 - vUv.x, vUv.y), edgeWeight(1.0 - vUv.x));",
      "    addNeighbor(colorSum, weightSum, 4, vec2(vUv.x, 1.0 - vUv.y), edgeWeight(vUv.y));",
      "  } else if (uSurface == 3) {",
      "    addNeighbor(colorSum, weightSum, 1, vec2(1.0 - vUv.x, vUv.y), edgeWeight(vUv.x));",
      "    addNeighbor(colorSum, weightSum, 0, vec2(1.0 - vUv.x, vUv.y), edgeWeight(1.0 - vUv.x));",
      "    addNeighbor(colorSum, weightSum, 4, vec2(1.0 - vUv.x, vUv.y), edgeWeight(vUv.y));",
      "  } else {",
      "    addNeighbor(colorSum, weightSum, 0, vec2(vUv.y, vUv.x), edgeWeight(vUv.x));",
      "    addNeighbor(colorSum, weightSum, 1, vec2(1.0 - vUv.y, 1.0 - vUv.x), edgeWeight(1.0 - vUv.x));",
      "    addNeighbor(colorSum, weightSum, 3, vec2(1.0 - vUv.x, vUv.y), edgeWeight(vUv.y));",
      "    addNeighbor(colorSum, weightSum, 2, vec2(vUv.x, 1.0 - vUv.y), edgeWeight(1.0 - vUv.y));",
      "  }",
      "  gl_FragColor = vec4(colorSum / weightSum, 1.0);",
      "  #include <colorspace_fragment>",
      "}",
    ].join("\n");

    const canvas = document.querySelector("#room");
    const surfaceNames = ["center", "back", "right", "left", "floor"];
    const videos = Object.fromEntries(
      surfaceNames.map((name) => [
        name,
        document.querySelector(`#projection-${name}`),
      ]),
    );

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: false,
      powerPreference: "high-performance",
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.6));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x010305);

    const camera = new THREE.PerspectiveCamera(
      72,
      window.innerWidth / window.innerHeight,
      0.05,
      100,
    );
    camera.position.set(8.2, ROOM.eyeHeight, 0);

    const videoTextures = Object.fromEntries(
      Object.entries(videos).map(([name, video]) => {
        video.loop = true;
        video.muted = true;
        video.playsInline = true;
        video.src = `${MEDIA_BASE}/${name}.mp4`;
        const texture = new THREE.VideoTexture(video);
        texture.flipY = true;
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.generateMipmaps = false;
        return [name, texture];
      }),
    );

    const projectionMaterials = Object.fromEntries(
      Object.keys(videoTextures).map((name) => {
        const material = new THREE.ShaderMaterial({
          uniforms: {
            uCenter: { value: videoTextures.center },
            uBack: { value: videoTextures.back },
            uRight: { value: videoTextures.right },
            uLeft: { value: videoTextures.left },
            uFloor: { value: videoTextures.floor },
            uSurface: { value: SURFACE_IDS[name] },
            uSeam: { value: SEAM_WIDTH },
          },
          vertexShader: seamVertexShader,
          fragmentShader: seamFragmentShader,
          side: THREE.DoubleSide,
          toneMapped: false,
        });
        material.name = `SmoothRayFinal_${name}`;
        return [name, material];
      }),
    );

    const blackMaterial = new THREE.MeshStandardMaterial({
      color: 0x020508,
      roughness: 0.82,
      metalness: 0.18,
    });

    function surface(width, height, x, y, z, rx, ry, rz, material) {
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(width, height), material);
      mesh.position.set(x, y, z);
      mesh.rotation.set(rx, ry, rz);
      scene.add(mesh);
      return mesh;
    }

    const halfLength = ROOM.length / 2;
    const halfWidth = ROOM.width / 2;
    const halfHeight = ROOM.height / 2;

    surface(
      ROOM.width,
      ROOM.height,
      -halfLength,
      halfHeight,
      0,
      0,
      Math.PI / 2,
      0,
      projectionMaterials.center,
    );
    surface(
      ROOM.width,
      ROOM.height,
      halfLength,
      halfHeight,
      0,
      0,
      -Math.PI / 2,
      0,
      projectionMaterials.back,
    );
    surface(
      ROOM.length,
      ROOM.height,
      0,
      halfHeight,
      -halfWidth,
      0,
      0,
      0,
      projectionMaterials.right,
    );
    surface(
      ROOM.length,
      ROOM.height,
      0,
      halfHeight,
      halfWidth,
      0,
      Math.PI,
      0,
      projectionMaterials.left,
    );
    surface(
      ROOM.length,
      ROOM.width,
      0,
      0,
      0,
      -Math.PI / 2,
      0,
      0,
      projectionMaterials.floor,
    );
    const ceiling = surface(
      ROOM.length,
      ROOM.width,
      0,
      ROOM.height,
      0,
      Math.PI / 2,
      0,
      0,
      blackMaterial,
    );
    ceiling.name = "DarkTechnicalCeiling";

    function box(name, sx, sy, sz, x, y, z, material) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), material);
      mesh.name = name;
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    const corners = [
      [-halfLength, -halfWidth],
      [-halfLength, halfWidth],
      [halfLength, -halfWidth],
      [halfLength, halfWidth],
    ];
    corners.forEach(([x, z], index) => {
      box("Corner" + index, 0.12, ROOM.height, 0.12, x, halfHeight, z, blackMaterial);
    });

    [
      [ROOM.length, 0.12, 0.1, 0, 4.94, -4.96],
      [ROOM.length, 0.12, 0.1, 0, 4.94, 4.96],
      [0.1, 0.12, ROOM.width, -9.96, 4.94, 0],
      [0.1, 0.12, ROOM.width, 9.96, 4.94, 0],
      [ROOM.length, 0.07, 0.06, 0, 0.035, -4.97],
      [ROOM.length, 0.07, 0.06, 0, 0.035, 4.97],
      [0.06, 0.07, ROOM.width, -9.97, 0.035, 0],
      [0.06, 0.07, ROOM.width, 9.97, 0.035, 0],
    ].forEach(([sx, sy, sz, x, y, z], index) => {
      box("Beam" + index, sx, sy, sz, x, y, z, blackMaterial);
    });

    [-8, -4, 0, 4, 8].forEach((x, index) => {
      box("Truss" + index, 0.09, 0.1, 9.8, x, 4.84, 0, blackMaterial);
    });

    const chairFabric = new THREE.MeshStandardMaterial({
      color: 0x082a68,
      roughness: 0.58,
      metalness: 0,
    });
    const chairFrame = new THREE.MeshStandardMaterial({
      color: 0x05090f,
      roughness: 0.3,
      metalness: 0.72,
    });
    const obstacles = [];

    function chair(x, z, index) {
      const group = new THREE.Group();
      group.name = "Chair" + index;

      const seat = new THREE.Mesh(
        new THREE.BoxGeometry(0.46, 0.09, 0.46),
        chairFabric,
      );
      seat.position.set(0, 0.44, 0);

      const back = new THREE.Mesh(
        new THREE.BoxGeometry(0.07, 0.5, 0.46),
        chairFabric,
      );
      back.position.set(0.2, 0.73, 0);
      back.rotation.z = -0.1;

      const pedestal = new THREE.Mesh(
        new THREE.BoxGeometry(0.07, 0.37, 0.28),
        chairFrame,
      );
      pedestal.position.set(0.03, 0.22, 0);

      const foot = new THREE.Mesh(
        new THREE.BoxGeometry(0.4, 0.05, 0.36),
        chairFrame,
      );
      foot.position.set(0.03, 0.025, 0);

      [seat, back, pedestal, foot].forEach((part) => {
        part.castShadow = true;
        part.receiveShadow = true;
        group.add(part);
      });

      group.position.set(x, 0, z);
      scene.add(group);
      obstacles.push({
        minX: x - 0.35,
        maxX: x + 0.35,
        minZ: z - 0.35,
        maxZ: z + 0.35,
      });
    }

    let chairIndex = 0;
    [-2.8, -0.7, 1.4, 3.5].forEach((x) => {
      [-3.35, -2.25, -1.15, 1.15, 2.25, 3.35].forEach((z) => {
        chairIndex += 1;
        chair(x, z, chairIndex);
      });
    });

    const hemisphere = new THREE.HemisphereLight(0x4f9ccc, 0x04070d, 1.7);
    scene.add(hemisphere);

    const coolLight = new THREE.PointLight(0x63b7ff, 42, 15, 2);
    coolLight.position.set(2, 4.45, 0);
    coolLight.castShadow = true;
    scene.add(coolLight);

    const warmLight = new THREE.PointLight(0xff8a42, 30, 12, 2);
    warmLight.position.set(-5.7, 4.1, 0);
    scene.add(warmLight);

    const shadowFloor = new THREE.Mesh(
      new THREE.PlaneGeometry(ROOM.length, ROOM.width),
      new THREE.ShadowMaterial({ color: 0x000000, opacity: 0.32 }),
    );
    shadowFloor.rotation.x = -Math.PI / 2;
    shadowFloor.position.y = 0.012;
    shadowFloor.receiveShadow = true;
    scene.add(shadowFloor);

    const keys = new Set();
    let yaw = Math.PI / 2;
    let pitch = -0.015;
    let dragging = false;
    let lastX = 0;
    let lastY = 0;
    const radius = 0.28;

    function applyRotation() {
      camera.rotation.order = "YXZ";
      camera.rotation.set(pitch, yaw, 0);
    }

    function rotate(dx, dy) {
      yaw -= dx * 0.0018;
      pitch -= dy * 0.0018;
      pitch = THREE.MathUtils.clamp(
        pitch,
        THREE.MathUtils.degToRad(-82),
        THREE.MathUtils.degToRad(82),
      );
      applyRotation();
    }

    function collides(x, z) {
      return obstacles.some(
        (obstacle) =>
          x + radius > obstacle.minX &&
          x - radius < obstacle.maxX &&
          z + radius > obstacle.minZ &&
          z - radius < obstacle.maxZ,
      );
    }

    function updateMovement(delta) {
      const forwardInput = (keys.has("KeyW") ? 1 : 0) - (keys.has("KeyS") ? 1 : 0);
      const rightInput = (keys.has("KeyD") ? 1 : 0) - (keys.has("KeyA") ? 1 : 0);
      if (forwardInput === 0 && rightInput === 0) return;

      const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
      const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
      const direction = new THREE.Vector3()
        .addScaledVector(forward, forwardInput)
        .addScaledVector(right, rightInput)
        .normalize();
      const running = keys.has("ShiftLeft") || keys.has("ShiftRight");
      const distance = (running ? 5.6 : 3.2) * Math.min(delta, 0.05);

      const nextX = camera.position.x + direction.x * distance;
      const nextZ = camera.position.z + direction.z * distance;
      if (!collides(nextX, camera.position.z)) {
        camera.position.x = THREE.MathUtils.clamp(nextX, -9.58, 9.58);
      }
      if (!collides(camera.position.x, nextZ)) {
        camera.position.z = THREE.MathUtils.clamp(nextZ, -4.58, 4.58);
      }
      camera.position.y = ROOM.eyeHeight;
    }

    document.addEventListener("keydown", (event) => {
      if (["KeyW", "KeyA", "KeyS", "KeyD", "ShiftLeft", "ShiftRight"].includes(event.code)) {
        event.preventDefault();
        keys.add(event.code);
      }
    });
    document.addEventListener("keyup", (event) => keys.delete(event.code));
    window.addEventListener("blur", () => keys.clear());

    document.addEventListener("mousemove", (event) => {
      if (document.pointerLockElement === canvas) {
        rotate(event.movementX, event.movementY);
      }
    });

    canvas.addEventListener("pointerdown", (event) => {
      dragging = true;
      lastX = event.clientX;
      lastY = event.clientY;
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener("pointermove", (event) => {
      if (!dragging || document.pointerLockElement === canvas) return;
      rotate(event.clientX - lastX, event.clientY - lastY);
      lastX = event.clientX;
      lastY = event.clientY;
    });
    canvas.addEventListener("pointerup", () => {
      dragging = false;
    });
    canvas.addEventListener("pointercancel", () => {
      dragging = false;
    });
    canvas.addEventListener("click", () => {
      canvas.focus({ preventScroll: true });
      canvas.requestPointerLock();
      if (Object.values(videos).some((video) => video.paused)) {
        playVideos();
      }
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.6));
      renderer.setSize(window.innerWidth, window.innerHeight, false);
    });

    applyRotation();

    async function playVideos() {
      const results = await Promise.allSettled(
        Object.values(videos).map((video) => video.play()),
      );
      results.forEach((result) => {
        if (result.status === "rejected") {
          console.warn("Не удалось автоматически запустить видео", result.reason);
        }
      });
    }

    Object.entries(videos).forEach(([name, video]) => {
      video.addEventListener("error", () => {
        console.error(
          `Не удалось загрузить экран ${name}. Media error:`,
          video.error?.code ?? "unknown",
        );
      });
      video.load();
    });
    playVideos();

    const clock = new THREE.Clock();
    let firstFrameRendered = false;

    function circularVideoDrift(video, masterVideo) {
      let drift = video.currentTime - masterVideo.currentTime;
      const duration = masterVideo.duration;
      if (!Number.isFinite(duration) || duration <= 0) return drift;
      const halfDuration = duration / 2;
      if (drift > halfDuration) drift -= duration;
      if (drift < -halfDuration) drift += duration;
      return drift;
    }

    function render() {
      updateMovement(clock.getDelta());

      const masterVideo = videos.center;
      if (masterVideo.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
        Object.entries(videos).forEach(([name, video]) => {
          if (
            name !== "center" &&
            video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA &&
            Math.abs(circularVideoDrift(video, masterVideo)) > 0.05
          ) {
            video.currentTime = masterVideo.currentTime;
          }
        });
      }

      renderer.render(scene, camera);
      if (!firstFrameRendered) {
        firstFrameRendered = true;
        document.documentElement.dataset.ready = "true";
      }
      requestAnimationFrame(render);
    }

    window.__projectionHall = {
      renderer,
      scene,
      camera,
      videos,
      videoTextures,
      projectionMaterials,
      ceiling,
      obstacles,
    };
    render();
  </script>
</body>
</html>
