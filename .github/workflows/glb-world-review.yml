name: Validate GLB world pass

on:
  push:
    branches: [work/glb-world-pass]

permissions:
  contents: write

concurrency:
  group: glb-world-review
  cancel-in-progress: true

jobs:
  review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply checked GLB world source payload
        run: |
          cat .glb-world-migrate.parts/*.part > /tmp/glb-world-migrate.py
          python /tmp/glb-world-migrate.py
          python .glb-color-fix.py
      - name: Build authored GLB assets
        run: |
          python -m pip install --disable-pip-version-check --quiet "trimesh[easy]==4.11.1" "numpy>=2,<3"
          python tools/generate_models.py
          test $(find assets/models -name '*.glb' | wc -l) -eq 16
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check, test and build
        run: npm run check && npm test && npm run build
      - name: Validate standalone bundle
        run: |
          node --check js/game.bundle.js
          test -s js/game.bundle.js
          git diff --check
      - name: Direct file launch
        run: npm run smoke:local
      - name: Offline gameplay and visual sweep
        run: npm run smoke:art
      - name: Archive review
        if: always()
        run: |
          mkdir -p /tmp/glb-world-review
          cp -R test-results /tmp/glb-world-review/ 2>/dev/null || true
          tar --exclude=.git --exclude=node_modules --exclude=test-results -czf /tmp/glb-world-review/source-and-build.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glb-world-review
          path: /tmp/glb-world-review/
          retention-days: 7
      - name: Commit validated browser bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Generated build is current"
          else
            git commit -m "build: refresh coloured GLB world bundle"
            git push origin HEAD:work/glb-world-pass
          fi
