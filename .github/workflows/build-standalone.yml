name: Build standalone browser game

on:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'ui/**'
      - 'css/**'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'index3d.html'
      - '.github/workflows/build-standalone.yml'

permissions:
  contents: write

concurrency:
  group: standalone-browser-build
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check sources
        run: npm run check

      - name: Build standalone browser bundle
        run: npm run build

      - name: Validate generated bundle
        run: |
          node --check js/game.bundle.js
          git diff --check
          test -s js/game.bundle.js

      - name: Smoke-test direct file launch
        run: npm run smoke:local

      - name: Archive browser build and sources
        run: |
          mkdir -p /tmp/arbuz-review
          tar --exclude=.git --exclude=node_modules --exclude=projection-hall/media --exclude=test-results -czf /tmp/arbuz-review/browser-source.tar.gz .
          tar -czf /tmp/arbuz-review/build-tools.tar.gz node_modules/three node_modules/esbuild node_modules/@esbuild

      - name: Upload review build
        uses: actions/upload-artifact@v4
        with:
          name: arbuz-visual-review
          path: /tmp/arbuz-review/
          retention-days: 7

      - name: Commit generated browser build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/game.bundle.js package-lock.json
          if git diff --cached --quiet; then
            echo "Generated build is already current"
          else
            git commit -m "build: refresh standalone browser game"
            git push
          fi
