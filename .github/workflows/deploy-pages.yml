name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - projection-hall-media
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v6
        with:
          ref: main
          path: site

      - name: Check out projection media
        uses: actions/checkout@v6
        with:
          ref: projection-hall-media
          path: hall-media

      - name: Add projection media to site
        shell: bash
        run: |
          set -euo pipefail
          IFS=$'\n\t'

          readonly target="site/projection-hall/media"
          mkdir -p "$target"
          cp hall-media/*.mp4 "$target/"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
